<!DOCTYPE html>
<html>
	<head>
		<title>Create Trek</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    		<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
		<link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
	
	</head>
	<body class="bg-warning-subtle">
	<div class="container py-1">
		<div class="row justify-content-center py-5">
		<div class="col-md-6 col-lg-5">
			<div class="card shadow-lg border-0 bg-light py-1">
				<div class="card-header bg-dark text-white text-center">
					<h4 class="mb-0">
						<i class="bi bi-tree-fill"></i>
								Edit {{ slot.treks.trek_name }} Trek Slot
					</h4>
				</div>
				<div class="card-body p-4">
					<h3 class="text-center text-warning-emphasis fw-bold py-3">
						Slot Details						
					</h3>
					{% with messages=get_flashed_messages(with_categories=true) %}
					{% if messages %}
					{% for category,message in messages %}
					<div class="
						{% if category == "success" %}
							alert alert-success
						{% elif category == "info" %}
							alert alert-info
						{% elif category == "warning" %}
							alert alert-warning
						{% elif category == "error" %}
							alert alert-danger
						{% else %}
							alert alert-secondary
						{% endif %}">{{ message }}
					</div>
					{% endfor %}
					{% endif %}
					{% endwith %}
					<form action="{{ url_for('main.update_slot',id=slot.slot_id) }}" method="POST" name="form">
						<div>
							<label class="form-label fw-semibold">Slot Id</label>
							<input type="text" name="id" class="form-control" value="{{ slot.slot_id }}" disabled>
						</div>
						<div>
							<label class="form-label fw-semibold">Trek Name</label>
							<input type="text" name="name" class="form-control" value="{{ slot.treks.trek_name }}" disabled>
						</div>
						<div>
							<label class="form-label fw-semibold">Slot Date</label>
							<input type="date" name="slot_date" class="form-control" {% if slot.slot_date!=None %}value="{{ slot.slot_date.isoformat() }}" {% endif %} {% if current_user.role == "admin" %} required {% else %} disabled {% endif %}>
						</div>
						<div>
							<label class="form-label fw-semibold">Slot Time</label>
							<input type="time" name="slot_time" class="form-control" {% if slot.slot_time!=None %}value="{{ slot.slot_time.isoformat() }}" {% endif %} {% if current_user.role == "admin" %} required {% else %} disabled {% endif %}>
						</div>
						<div>
							<label class="form-label fw-semibold">Open Slots Available(apart from booked)</label>
							<input type="number" name="slot_limit" class="form-control" {% if slot.slot_limit!=None %}value="{{ slot.slot_limit }}" {% endif %} required>
						</div>
						<div>
							<label class="form-label fw-semibold">Slot status</label>
							<input type="text" name="slot_status" class="form-control" {% if slot.slot_status!=None %}value="{{ slot.status }}" {% endif %} {% if current_user.role == "admin" %} required {% endif %}>
						</div>
						<div class="text-center mt-3">
							<button type="submit" class="btn btn-success w-80">
								Edit
							</button>
						</div>
					</form>
					<div class="text-center">
					<span class="px-2">
						<a href="{{ url_for('main.trek',id=slot.trek_id) }}">Go Back</a>
					</span>
					</div>
				</div>
			</div>
		</div>
		</div>
	</div>
	</body>
</html>
