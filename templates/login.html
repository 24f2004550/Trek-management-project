<!DOCTYPE html>
<html>
	<head>
		<title>Login</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    		<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
		<link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
	
	</head>
	<body class="bg-warning-subtle">
	<div class="container py-5">
		<div class="row justify-content-center py-5">
		<div class="col-md-6 col-lg-5">
			<div class="card shadow-lg border-0 bg-light py-1">
				<div class="card-header bg-success text-white text-center">
					<h4 class="mb-0">
						<i class="bi bi-person-circle"></i>
								Login
					</h4>
				</div>
				<div class="card-body p-4">
					<h3 class="text-center text-warning-emphasis fw-bold py-3">
					<img src="{{ url_for('static',filename='trek_logo.png') }}" alt="Trek Manager logo" width="50">
						Trek Manager
					</h3>
					{% with messages=get_flashed_messages(with_categories=true) %}
					{% if messages %}
					{% for category,message in messages %}
					<div class="
						{% if category == "success" %}
							alert alert-success
						{% elif category == "info" %}
							alert alert-info
						{% elif category == "warning" %}
							alert alert-warning
						{% elif category == "error" %}
							alert alert-danger
						{% else %}
							alert alert-secondary
						{% endif %}">{{ message }}
					</div>
					{% endfor %}
					{% endif %}
					{% endwith %}
					<form action="/" method="POST" name="form">
						<div>
							<label class="form-label fw-semibold">Username/Email</label>
							<input type="text" name="user" class="form-control" required>
						</div>
						<div>
							<label class="form-label fw-semibold">Password</label>
							<input type="password" name="password" class="form-control" required>
						</div>
						<div>
							<label class="form-label fw-semibold">Role</label>
							<select name="role" class="form-select" required>
								<option value="">Select Role</option>
								<option value="admin">Admin</option>
								<option value="user">User</option>
								<option value="staff">Staff</option>
							</select>
						</div>
						<div class="text-center mt-3">
							<button type="submit" class="btn btn-success w-80">
								Login
							</button>
						</div>
					</form>
					<div class="text-center">
						Don't Have an account?
						<a href="/register/user">Register</a>
					</div>
				</div>
			</div>
		</div>
		</div>
	</div>
	</body>
</html>
