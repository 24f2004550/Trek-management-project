<!DOCTYPE html>
<html>
	<head>
		<title>Register</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    		<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
		<link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
	
	</head>
	<body class="bg-warning-subtle">
	<div class="container py-1">
		<div class="row justify-content-center py-5">
		<div class="col-md-6 col-lg-5">
			<div class="card shadow-lg border-0 bg-light py-1">
				<div class="card-header bg-dark text-white text-center">
					<h4 class="mb-0">
						<i class="bi bi-key-circle"></i>
								Password Update
 					</h4>
				</div>
				<div class="card-body p-4">
					{% with messages=get_flashed_messages(with_categories=true) %}
					{% if messages %}
					{% for category,message in messages %}
					<div class="
						{% if category == "success" %}
							alert alert-success
						{% elif category == "info" %}
							alert alert-info
						{% elif category == "warning" %}
							alert alert-warning
						{% elif category == "error" %}
							alert alert-danger
						{% else %}
							alert alert-secondary
						{% endif %}">{{ message }}
					</div>
					{% endfor %}
					{% endif %}
					{% endwith %}
					<form action="{{ url_for('main.change_password',id=user.user_id) }}" method="POST" name="form">
						<div class="text-center mt-3">
							<div>
							<label class="form-label fw-semibold">Old Password</label>
							<input type="password" name="old_password" class="form-control">
							</div>
							<div>
							<label class="form-label fw-semibold">New Password</label>
							<input type="password" name="new_password" class="form-control" required>
							</div>
							<div>
							<label class="form-label fw-semibold">Confirm Password</label>
							<input type="password" name="confirm_password" class="form-control" required>
							</div>
							<div class="py-2">
							<button type="submit" class="btn btn-danger w-100">
								Update
							</button>
							</div>
						</div>
					</form>
					<div class="text-center">
					<span class="px-2">
						<a href="{{ url_for("main.profile",id=user.user_id) }}">Back</a>
					</span>
					</div>
				</div>
			</div>
		</div>
		</div>
	</div>
	</body>
</html>
