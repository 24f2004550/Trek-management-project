
<!DOCTYPE html>
<html>
	<head>
		<title>Login</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    		<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
		<link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
	
	</head>
	<body class="bg-warning-subtle">
	<div class="container py-5">
		<div class="row justify-content-center py-5">
		<div class="col-md-6 col-lg-5">
			<div class="card shadow-lg border-0 bg-light py-1">
				<div class="card-header bg-dark text-white text-center">
					<h4 class="mb-0">
						<i class="bi bi-person-circle"></i>
								Assign Staff
					</h4>
				</div>
				<div class="card-body p-4">
					<h3 class="text-center text-warning-emphasis fw-bold py-3">
						Trek Manager
					</h3>
					{% with messages=get_flashed_messages(with_categories=true) %}
					{% if messages %}
					{% for category,message in messages %}
					<div class="
						{% if category == "success" %}
							alert alert-success
						{% elif category == "info" %}
							alert alert-info
						{% elif category == "warning" %}
							alert alert-warning
						{% elif category == "error" %}
							alert alert-danger
						{% else %}
							alert alert-secondary
						{% endif %}">{{ message }}
					</div>
					{% endfor %}
					{% endif %}
					{% endwith %}
					<form action="{{ url_for('main.assign_staff_to_slot',id=slot.slot_id) }}" method="POST" name="form">
						<div>
							<label class="form-label fw-semibold">Trek Name</label>
							<input type="text" name="trek_name" class="form-control" value="{{ slot.treks.trek_name }}" disabled>
						</div>
						<div>
							<label class="form-label fw-semibold">Slot Date</label>
							<input type="text" name="slot_date" class="form-control" {% if slot.slot_date != None %}value="{{ slot.slot_date.isoformat() }}" {% else %} value="Slot date not decided yet." {% endif %} disabled>
						</div>
						<div>
							<label class="form-label fw-semibold">Slot Time</label>
							<input type="text" name="slot_time" class="form-control" {% if slot.slot_time != None %}value="{{ slot.slot_time.isoformat() }}" {% else %} value="Slot time not decide yet." {% endif %} disabled>
						</div>
<div>
							<label class="form-label fw-semibold">Slot Limit</label>
							<input type="text" name="slot_limit" class="form-control" {% if slot.slot_limit != None %}value="{{ slot.slot_limit }}" {% else %} value="Slot size not defined yet." {% endif %} disabled>
						</div>
						{% if staff|length >0 %}
						<div>
							<label class="form-label fw-semibold">Staff</label>
							<select name="staff" multiple class="form-select" required>
								<option value="">Select staff</option>
								{% if staff|length>0 %}
								{% for s in staff%}
								<option value={{ s.user_id }}>{{ s.name }}</option>{% endfor %}{% endif %}
							</select>
						</div>
						<div class="text-center mt-3">
							<button type="submit" class="btn btn-success w-80">
								Assign
							</button>
						</div>
						{% else %}<h4 class="py-2">No staff found or registered.</h4>
						{% endif %}
						
					</form>
					<div class="text-center">
						<a href="{{ url_for('main.slot_info',id=slot.slot_id) }}">Go back</a>
					</div>
				</div>
			</div>
		</div>
		</div>
	</div>
	</body>
</html>
