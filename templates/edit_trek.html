<!DOCTYPE html>
<html>
	<head>
		<title>Create Trek</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    		<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
		<link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
	
	</head>
	<body class="bg-warning-subtle">
	<div class="container py-1">
		<div class="row justify-content-center py-5">
		<div class="col-md-6 col-lg-5">
			<div class="card shadow-lg border-0 bg-light py-1">
				<div class="card-header bg-dark text-white text-center">
					<h4 class="mb-0">
						<i class="bi bi-tree-fill"></i>
								Edit {{ trek.trek_name }} Trek
					</h4>
				</div>
				<div class="card-body p-4">
					<h3 class="text-center text-warning-emphasis fw-bold py-3">
						Trek Details						
					</h3>
					{% with messages=get_flashed_messages(with_categories=true) %}
					{% if messages %}
					{% for category,message in messages %}
					<div class="
						{% if category == "success" %}
							alert alert-success
						{% elif category == "info" %}
							alert alert-info
						{% elif category == "warning" %}
							alert alert-warning
						{% elif category == "error" %}
							alert alert-danger
						{% else %}
							alert alert-secondary
						{% endif %}">{{ message }}
					</div>
					{% endfor %}
					{% endif %}
					{% endwith %}
					<form action="{{ url_for('main.edit_trek',id=trek.trek_id) }}" method="POST" name="form">
						<div>
							<label class="form-label fw-semibold">Trek Id</label>
							<input type="text" name="id" class="form-control" value="{{ trek.trek_id }}" disabled>
						</div>
						<div>
							<label class="form-label fw-semibold">Trek Name</label>
							<input type="text" name="name" class="form-control" value="{{ trek.trek_name }}" required>
						</div>
						<div>
							<label class="form-label fw-semibold">Location</label>
							<input type="text" name="location" class="form-control" value="{{ trek.location }}" required>
						</div>
						<div>
							<label class="form-label fw-semibold">Difficulty</label>
							<select name="difficulty" class="form-select" required>
								<option value="">Select difficulty</option>
								<option value="easy">Easy</option>
								<option value="medium">Medium</option>
								<option value="hard">Hard</option>
							</select>
						</div>

						<div>
							<label class="form-label fw-semibold">Duration(days)</label>
							<input type="number" name="duration" class="form-control" value="{{ trek.duration }}" required>
						</div>
						<div>
							<label class="form-label fw-semibold">Available slots</label>
							<input type="number" name="slots" class="form-control" value="{{ count }}"required>
						</div>

						<div>
							<label class="form-label fw-semibold">Trek Booking starts</label>
							<input type="date" name="booking_start" class="form-control" value="{{ trek.trek_book_start.isoformat() }}"required>
						</div>
						<div>
							<label class="form-label fw-semibold">Trek Booking closes</label>
							<input type="date" name="booking_close" class="form-control" value="{{ trek.trek_book_end.isoformat() }}"required>
						</div>
						<div>
							<label class="form-label fw-semibold">Cost per person</label>
							<input type="number" name="cost" class="form-control" value="{{ trek.cost }}"required>
						</div>
						<div>
							<label class="form-label fw-semibold">Report before(in hrs)</label>
							<input type="number" name="report_before" class="form-control" value="{{ trek.report_before }}"required>
						</div>
						<div>
							<label class="form-label fw-semibold">Trek description</label>
							<input type="text" name="description" class="form-control" value="{{ trek.description }}"required>
						</div>
						<div class="text-center mt-3">
							<button type="submit" class="btn btn-success w-80">
								Edit
							</button>
						</div>
					</form>
					<div class="text-center">
					<span class="px-2">
						<a href="{{ url_for('main.trek',id=trek.trek_id) }}">Go Back</a>
					</span>
					</div>
				</div>
			</div>
		</div>
		</div>
	</div>
	</body>
</html>
