<!DOCTYPE html>
<html>
	<head>
		<title>Review</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    		<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
		<link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
	
	</head>
	<body class="bg-warning-subtle">
	<div class="container py-5">
		<div class="row justify-content-center py-5">
		<div class="col-md-6 col-lg-5">
			<div class="card shadow-lg border-0 bg-light py-1">
				<div class="card-header bg-success text-white text-center">
					<h4 class="mb-0">
						<i class="bi bi-person-circle"></i>
								Review a trek
					</h4>
				</div>
				<div class="card-body p-4">
					{% with messages=get_flashed_messages(with_categories=true) %}
					{% if messages %}
					{% for category,message in messages %}
					<div class="
						{% if category == "success" %}
							alert alert-success
						{% elif category == "info" %}
							alert alert-info
						{% elif category == "warning" %}
							alert alert-warning
						{% elif category == "error" %}
							alert alert-danger
						{% else %}
							alert alert-secondary
						{% endif %}">{{ message }}
					</div>
					{% endfor %}
					{% endif %}
					{% endwith %}
					<form action="/" method="POST" name="form">
						<div>
							<label class="form-label fw-semibold">Booking_id</label>
							<input type="text" name="booking_id" class="form-control" value="{{ booking_id }}" disabled>
						</div>
						<div>
							<label class="form-label fw-semibold">Trek</label>
							<input type="text" name="trek_name" class="form-control" value="{{ trek.trek_name }}" disabled>
						</div>
						<div>
							<label class="form-label fw-semibold">Review</label>
							<textarea rows="5" name="review" class="form-control" required></textarea>
						</div>
						
						<div class="text-center mt-3">
							<button type="submit" class="btn btn-success w-80">
								Submit
							</button>
						</div>
					</form>
					<div class="text-center">
						<a href="{{ url_for("main.user_all_bookings",id=current_user.user_id) }}">Go back</a>
					</div>
				</div>
			</div>
		</div>
		</div>
	</div>
	</body>
</html>
